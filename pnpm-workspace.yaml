packages:
  - 'packages/*'
  - 'apps/*'
allowBuilds:
  '@prisma/engines': true
  argon2: true
  cypress: true
  esbuild: true
  nx: true
  prisma: true
  styled-components: true
  unrs-resolver: true
catalog:
  tslib: "^2.8.1"
  pino: "^10.3.1"
  pino-pretty: "^13.1.3"
  fastify: "^5.2.1"
  "@fastify/sensible": "^6.0.2"
  "@fastify/autoload": "^6.0.3"
  fastify-plugin: "^5.0.1"
  argon2: "^0.44.0"
  zod: "^4.4.3"
  dotenv: ^17.4.2
  prisma: "^7.8.0"
  "@types/pg": "^8.20.0"
  "@prisma/client": "^7.8.0"
  "@prisma/adapter-pg": "^7.8.0"
  "pg": "^8.21.0"
  '@fastify/swagger-ui': ^5.2.6
  '@fastify/swagger': ^9.7.0
injectWorkspacePackages: true
syncInjectedDepsAfterScripts:
  - build
