include:
  - ./compose.base.yaml

services:
  postgres:
    ports:
      - "${DB_PORT}:${DB_PORT}"

  rabbitmq:
    ports:
      - "${RABBITMQ_PORT}:5672"
      - "${RABBITMQ_UI_PORT}:15672"

  redis:
    ports:
      - "${REDIS_PORT}:6379"

  auth-service:
    ports:
      - "${AUTH_PORT}:${AUTH_PORT}"

  profile-service:
    ports:
      - "${PROFILE_PORT}:${PROFILE_PORT}"

  catalog-service:
    ports:
      - "${CATALOG_PORT}:${CATALOG_PORT}"

  notification-service:
    ports:
      - "${NOTIFICATION_PORT}:${NOTIFICATION_PORT}"

  web:
    ports:
      - "${WEB_PORT}:${WEB_PORT}"

  pgadmin:
    image: dpage/pgadmin4
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PG_ADMIN_EMAIL}
      PGADMIN_DEFAULT_PASSWORD: ${PG_ADMIN_PASSWORD}
    ports:
      - "5050:80"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
      - ../pgadmin/servers.json:/pgadmin4/servers.json:ro
    networks:
      - monorepo-network
    restart: unless-stopped

  mailpit:
    image: axllent/mailpit
    ports:
      - "${SMTP_PORT}:1025"
      - "${SMTP_WEB_PORT}:8025"
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8025"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - monorepo-network
    restart: unless-stopped

  nginx:
    image: nginx:1.25-alpine
    ports:
      - "${NGINX_PORT}:${NGINX_PORT}"
    environment:
      WEB_PORT: ${WEB_PORT}
      PROFILE_PORT: ${PROFILE_PORT}
      PROFILE_PATH_PREFIX: ${PROFILE_PATH_PREFIX}
      AUTH_PORT: ${AUTH_PORT}
      AUTH_PATH_PREFIX: ${AUTH_PATH_PREFIX}
      NGINX_HOST: ${NGINX_HOST}
      NGINX_PORT: ${NGINX_PORT}
    volumes:
      - ./nginx.conf.template:/etc/nginx/conf.d/nginx.conf.template
    command: >
      /bin/sh -c "envsubst '$$WEB_PORT $$PROFILE_PORT $$PROFILE_PATH_PREFIX $$AUTH_PORT $$AUTH_PATH_PREFIX $$NGINX_PORT $$NGINX_HOST'
      < /etc/nginx/conf.d/nginx.conf.template
      > /etc/nginx/conf.d/default.conf
      && nginx -g 'daemon off;'"
    depends_on:
      web:
        condition: service_healthy
      auth-service:
        condition: service_healthy
      profile-service:
        condition: service_healthy
      catalog-service:
        condition: service_healthy
      notification-service:
        condition: service_healthy
    networks:
      - monorepo-network
    restart: unless-stopped

volumes:
  pgadmin_data:
