include:
  - ./compose.infrastructure.yaml
  - ./compose.services.yaml
  - ./compose.dev.yaml

services:
  web:
    build:
      context: ../../apps/web
      dockerfile: Dockerfile
      args:
        WEB_PORT: ${WEB_PORT}
    environment:
      WEB_PORT: ${WEB_PORT}
      VITE_AUTH_SERVICE_PREFIX: ${AUTH_PATH_PREFIX}
      VITE_PROFILE_SERVICE_PREFIX: ${PROFILE_PATH_PREFIX}
    ports:
      - "${WEB_PORT}:${WEB_PORT}"
    depends_on:
      - profile-service
      - auth-service
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://${WEB_HOST}:${WEB_PORT}/"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - monorepo-network
    restart: unless-stopped

  nginx:
    image: nginx:1.25-alpine
    ports:
      - "${NGINX_PORT}:${NGINX_PORT}"
    environment:
      WEB_PORT: ${WEB_PORT}
      PROFILE_PORT: ${PROFILE_PORT}
      PROFILE_PATH_PREFIX: ${PROFILE_PATH_PREFIX}
      AUTH_PORT: ${AUTH_PORT}
      AUTH_PATH_PREFIX: ${AUTH_PATH_PREFIX}
      NGINX_HOST: ${NGINX_HOST}
      NGINX_PORT: ${NGINX_PORT}
    volumes:
      - ./nginx.conf.template:/etc/nginx/conf.d/nginx.conf.template
    command: >
      /bin/sh -c "envsubst '$$WEB_PORT $$PROFILE_PORT $$PROFILE_PATH_PREFIX $$AUTH_PORT $$AUTH_PATH_PREFIX $$NGINX_PORT $$NGINX_HOST'
      < /etc/nginx/conf.d/nginx.conf.template
      > /etc/nginx/conf.d/default.conf
      && nginx -g 'daemon off;'"
    depends_on:
      web:
        condition: service_healthy
      auth-service:
        condition: service_healthy
      profile-service:
        condition: service_healthy
      catalog-service:
        condition: service_healthy
      notification-service:
        condition: service_healthy    
    networks:
      - monorepo-network
    restart: unless-stopped

networks:
  monorepo-network:
    driver: bridge

volumes:
  rift_hub_pg:
  rabbitmq_data:
  redis_data:
  pgadmin_data:
